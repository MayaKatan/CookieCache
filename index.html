<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המשרד</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    box-sizing: border-box;
    background: #EFE8DE;
  }
  .office {
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 1.1;
    border: 6px solid #5E4B3C;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(60, 40, 20, .25);
  }
  .office > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Layer for furniture and characters.
     Floor area: left 3% to right 3%, top 15% to bottom 3%
     Side-wall exits: randomly generated each level (0, 2 or 4) */
  .objects {
    position: absolute;
    inset: 0;
  }
  .sound {
    position: absolute;
    top: 2%;
    right: 2%;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid #5E4B3C;
    background: rgba(255, 255, 255, .85);
    cursor: pointer;
  }
  .sound:hover { background: #fff; }

  /* Inner walls – look like office partitions with depth and shadow */
  .wall {
    position: absolute;
    border-radius: 3px;
    background: linear-gradient(#F6EEE2, #E4D5BF);
    box-shadow:
      0 5px 0 #B9A284,                 /* front face of the partition */
      0 12px 10px rgba(60, 40, 20, .22); /* shadow on the floor */
  }


  /* Collectible cookies */
  .cookie {
    position: absolute;
    width: 6.8%;
    transform: translate(-50%, -55%);
    filter: drop-shadow(0 4px 3px rgba(60, 40, 20, .35));
    pointer-events: none;
    user-select: none;
  }

  /* Main character – 6×6 frame sprite sheet (each frame 192×192) */
  .player {
    position: absolute;
    width: 12.4%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -100%);   /* anchor point = the feet */
    background: url("character.png") 0 0 / 600% 600% no-repeat;
    pointer-events: none;
  }

  /* The nerd – same sprite-sheet layout as the player */
  .nerd {
    position: absolute;
    width: 12.4%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -100%);
    background: url("nerd.png") 0 0 / 600% 600% no-repeat;
    pointer-events: none;
  }
  /* "?" / "!" bubble above the nerd's head */
  .nerd .bubble {
    position: absolute;
    left: 50%;
    top: -20%;
    transform: translateX(-50%);
    width: 26%;
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #3F4A54;
    color: #2F6FB5;
    font: 800 clamp(10px, 1.9vw, 18px) system-ui, sans-serif;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .25);
    animation: bob 1s ease-in-out infinite;
  }
  .nerd .bubble.alert {
    color: #fff;
    background: #D93A2B;
    border-color: #8E1F15;
  }
  @keyframes bob {
    50% { transform: translateX(-50%) translateY(-12%); }
  }

  /* Level-complete message */
  .toast {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.8);
    padding: 14px 28px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .92);
    border: 3px solid #5E4B3C;
    color: #5E4B3C;
    font: 700 clamp(18px, 3.5vw, 30px) system-ui, sans-serif;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 99999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Current level indicator */
  .level-label {
    position: absolute;
    top: 2.5%;
    left: 2%;
    padding: 8px 14px;
    border-radius: 999px;
    border: 2px solid #5E4B3C;
    background: rgba(255, 255, 255, .85);
    color: #5E4B3C;
    font: 600 14px system-ui, sans-serif;
    z-index: 9999;
  }
</style>
</head>

<script>
/* ============================================================
   Room settings (in percent of the office size)
   ============================================================ */
const FLOOR = { left: 3, top: 15, width: 94, height: 82 };
const COLS = 12, ROWS = 10;                 // invisible grid on the floor
const CW = FLOOR.width / COLS;              // cell width
const CH = FLOOR.height / ROWS;             // cell height
const T = 1.5, TH = T * 1.1;                // wall thickness (width / height)
const X = gx => FLOOR.left + gx * CW;
// Cookie types – to add a new type, just add its file to the list
const COOKIES = ["cookie1.png", "cookie2.png", "cookie3.png", "cookie4.png"];
const COOKIE_FILL = 0.45;   // how much of the floor is covered with cookies (0.45 = 45%)

// Picks a random cookie type for the level – always different from the previous level
let lastCookie = null;
function pickCookie() {
  let img;
  do { img = COOKIES[Math.floor(Math.random() * COOKIES.length)]; }
  while (img === lastCookie && COOKIES.length > 1);
  lastCookie = img;
  return img;
}
const Y = gy => FLOOR.top + gy * CH;

/* ============================================================
   Difficulty per level – change everything here in one place
   ============================================================ */
function difficulty(level) {
  return {
    walls: Math.min(3 + level, 9),          // more walls each level
    speed: 1 + (level - 1) * 0.15,          // speed (for the character / enemies / timer later)
  };
}

/* ============================================================
   Helpers
   ============================================================ */
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const key = (x, y) => x + "," + y;

/* ============================================================
   Exits: each pair = an exit in the left wall + an exit in the right wall at the same height.
   The character enters one and comes out of the other.
   Each exit is 2 cells tall. The number = the row where it starts.
   ============================================================ */
const EXIT_SIZE = 2;

function pickExits() {
  const count = [0, 2, 4][rand(0, 2)];     // 0 / 2 / 4 exits
  const minRow = 1, maxRow = ROWS - EXIT_SIZE - 1;   // not touching the corners
  if (count === 0) return [];
  if (count === 2) return [rand(minRow, maxRow)];
  let a, b;
  do { a = rand(minRow, maxRow); b = rand(minRow, maxRow); }
  while (Math.abs(a - b) < EXIT_SIZE + 2);  // gap between the two pairs
  return [a, b].sort((x, y) => x - y);
}

// Area near the exits – no walls allowed there
const nearExit = (exits, gx, gy) =>
  (gx <= 1 || gx >= COLS - 1) && exits.some(r => gy >= r - 1 && gy <= r + EXIT_SIZE + 1);
const onBorder = (gx, gy) => gx === 0 || gx === COLS || gy === 0 || gy === ROWS;

// Creates a straight or L-shaped wall. Each wall = a list of segments [x1,y1,x2,y2]
function makePiece() {
  const sx = rand(0, COLS), sy = rand(0, ROWS);
  const segs = [];
  if (Math.random() < 0.5) {
    const len = rand(2, 5);
    segs.push(Math.random() < 0.5 ? [sx, sy, sx + len, sy] : [sx, sy, sx, sy + len]);
  } else {
    const a = rand(2, 4) * (Math.random() < 0.5 ? 1 : -1);
    const b = rand(2, 4) * (Math.random() < 0.5 ? 1 : -1);
    segs.push([sx, sy, sx + a, sy], [sx, sy, sx, sy + b]);
  }
  return segs.map(([x1, y1, x2, y2]) =>
    [Math.min(x1, x2), Math.min(y1, y2), Math.max(x1, x2), Math.max(y1, y2)]);
}

function segPoints([x1, y1, x2, y2]) {
  const pts = [];
  for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) pts.push([x, y]);
  return pts;
}

/* ============================================================
   Board generation: walls that don't touch each other, don't block the exits,
   and the whole floor stays reachable for the character
   ============================================================ */
function generateBoard(level) {
  const { walls } = difficulty(level);
  const exits = pickExits();                 // picked once – so every option has the same chance

  // If it can't place all the walls – try again with one wall fewer
  for (let target = walls; target >= 1; target--)
  for (let attempt = 0; attempt < 100; attempt++) {
    const pieces = [];
    const blocked = new Set();

    for (let t = 0; t < 600 && pieces.length < target; t++) {
      const segs = makePiece();
      const pts = [...new Map(segs.flatMap(segPoints).map(p => [key(...p), p])).values()];

      const bad = pts.some(([x, y]) =>
        x < 0 || x > COLS || y < 0 || y > ROWS || nearExit(exits, x, y) || blocked.has(key(x, y)));
      if (bad) continue;
      if (pts.filter(([x, y]) => onBorder(x, y)).length > 1) continue; // touches an outer wall at one point at most

      pieces.push(segs);
      // keeps at least one cell of space from other walls – so there's room to pass
      pts.forEach(([x, y]) => {
        for (let dx = -1; dx <= 1; dx++)
          for (let dy = -1; dy <= 1; dy++) blocked.add(key(x + dx, y + dy));
      });
    }
    if (pieces.length < target) continue;

    // Check that every cell is reachable (breadth-first search from the corner)
    const vEdges = new Set(), hEdges = new Set();
    pieces.flat().forEach(([x1, y1, x2, y2]) => {
      if (x1 === x2) for (let y = y1; y < y2; y++) vEdges.add(key(x1, y));
      else           for (let x = x1; x < x2; x++) hEdges.add(key(x, y1));
    });

    const seen = new Set([key(0, 0)]);
    const queue = [[0, 0]];
    while (queue.length) {
      const [c, r] = queue.shift();
      const moves = [
        [c + 1, r, !vEdges.has(key(c + 1, r))],
        [c - 1, r, !vEdges.has(key(c, r))],
        [c, r + 1, !hEdges.has(key(c, r + 1))],
        [c, r - 1, !hEdges.has(key(c, r))],
      ];
      for (const [nc, nr, open] of moves) {
        if (open && nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS && !seen.has(key(nc, nr))) {
          seen.add(key(nc, nr));
          queue.push([nc, nr]);
        }
      }
    }
    if (seen.size < COLS * ROWS) continue;


    // Cookies in clusters over part of the floor (like the original game). One type per level
    const img = pickCookie();
    const cookieTarget = Math.round(COLS * ROWS * COOKIE_FILL);
    const filled = new Set();
    let frontier = [];
    const addCell = (c, r) => {
      if (c < 0 || c >= COLS || r < 0 || r >= ROWS || filled.has(key(c, r))) return;
      filled.add(key(c, r));
      frontier.push([c, r + 1], [c, r - 1], [c + 1, r], [c - 1, r]);
    };
    while (filled.size < cookieTarget) {
      frontier = frontier.filter(([c, r]) =>
        c >= 0 && c < COLS && r >= 0 && r < ROWS && !filled.has(key(c, r)));
      if (!frontier.length || Math.random() < 0.12) {
        addCell(rand(0, COLS - 1), rand(0, ROWS - 1));       // start a new cluster
      } else {
        const [c, r] = frontier.splice(rand(0, frontier.length - 1), 1)[0];
        addCell(c, r);                                          // grow an existing cluster
      }
    }
    const cookies = [...filled].map(k => {
      const [c, r] = k.split(",").map(Number);
      return { c, r, img };
    });

    return { pieces, exits, cookies, vEdges, hEdges };
  }
  return { pieces: [], exits, cookies: [], vEdges: new Set(), hEdges: new Set() };
}

/* ============================================================
   Draw the board in the objects layer
   ============================================================ */
function svgEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

// Draws the exits inside the SVG (SVG coordinates: width 1100, height 1000)
function renderExits(exits) {
  const g = document.getElementById("exits");
  g.innerHTML = "";
  exits.forEach(r => {
    const y1 = Y(r) * 10, y2 = Y(r + EXIT_SIZE) * 10, h = y2 - y1;
    [0, 1064].forEach(x => {
      const jx = x === 0 ? 0 : 1062;
      g.append(
        svgEl("rect", { x, y: y1, width: 36, height: h, fill: "url(#planks)" }),
        svgEl("rect", { x, y: y1, width: 36, height: h, fill: "#46301A", opacity: ".18" }),
        svgEl("rect", { x: jx, y: y1 - 8, width: 38, height: 10, fill: "#FBF7F0", stroke: "#7A6450", "stroke-width": 2 }),
        svgEl("rect", { x: jx, y: y2 - 2, width: 38, height: 10, fill: "#FBF7F0", stroke: "#7A6450", "stroke-width": 2 }),
      );
    });
  });
}

const cookieEls = new Map();   // "c,r" -> cookie element, so it can be removed when eaten

function renderBoard({ pieces, exits, cookies }) {
  renderExits(exits);
  const layer = document.getElementById("objects");
  layer.innerHTML = "";

  pieces.flat().forEach(([x1, y1, x2, y2]) => {
    const el = document.createElement("div");
    el.className = "wall";
    const left = X(x1) - T / 2, top = Y(y1) - TH / 2;
    const width = X(x2) - X(x1) + T, height = Y(y2) - Y(y1) + TH;
    Object.assign(el.style, {
      left: left + "%", top: top + "%", width: width + "%", height: height + "%",
      zIndex: Math.round((top + height) * 10),   // whatever is lower on screen is drawn in front
    });
    layer.appendChild(el);
  });

  cookieEls.clear();
  cookies.forEach(({ c, r, img }) => {
    const el = document.createElement("img");
    cookieEls.set(key(c, r), el);
    el.className = "cookie";
    el.src = img;
    el.alt = "";
    const top = Y(r + 0.5);
    Object.assign(el.style, {
      left: X(c + 0.5) + "%", top: top + "%", zIndex: Math.round(top * 10),
    });
    layer.appendChild(el);
  });
}

/* ============================================================
   Main character
   ============================================================ */
const PLAYER_SPEED = 3.5;     // cells per second (at level 1). Increases with difficulty
const EAT_TIME = 0.1;         // how many seconds the character stops to eat a cookie (0 = no stop)
const DANCE_TIME = 1.8;       // how long the dance lasts at the end of a level
const START = { c: Math.floor(COLS / 2), r: ROWS - 1 };   // starting cell

// Rows in the sprite sheet
const ANIM = { south: 0, north: 1, east: 2, west: 3, eat: 4, dance: 5 };
const DIRS = {
  up:    { dx: 0,  dy: -1, row: "north" },
  down:  { dx: 0,  dy: 1,  row: "south" },
  left:  { dx: -1, dy: 0,  row: "west"  },
  right: { dx: 1,  dy: 0,  row: "east"  },
};

let board, level = 1;
const player = {
  el: null,
  cell: { ...START },   // the cell the character is in
  target: null,         // the cell it's walking to
  t: 0,                 // progress between cells (0 to 1)
  dir: null,            // current direction
  want: null,           // the direction the player pressed
  facing: "south",
  eating: 0,
  dancing: 0,
  animTime: 0,
};

const isExitRow = r => board.exits.some(e => r >= e && r < e + EXIT_SIZE);

// Can the character move from a cell in a given direction (walls, edges and exits)
function canMove({ c, r }, d) {
  const nc = c + d.dx, nr = r + d.dy;
  if (d.dx === 1  && board.vEdges.has(key(c + 1, r))) return false;
  if (d.dx === -1 && board.vEdges.has(key(c, r)))     return false;
  if (d.dy === 1  && board.hEdges.has(key(c, r + 1))) return false;
  if (d.dy === -1 && board.hEdges.has(key(c, r)))     return false;
  if (nr < 0 || nr >= ROWS) return false;
  if (nc < 0 || nc >= COLS) return isExitRow(r);      // can only leave the room through an exit
  return true;
}

function setFrame(anim, frame) {
  player.el.style.backgroundPosition = `${frame * 20}% ${ANIM[anim] * 20}%`;
}

function drawPlayer() {
  const { cell, target, t } = player;
  const c = target ? cell.c + (target.c - cell.c) * t : cell.c;
  const r = target ? cell.r + (target.r - cell.r) * t : cell.r;
  const feet = Y(r + 0.5) + CH * 0.32;
  Object.assign(player.el.style, {
    left: X(c + 0.5) + "%",
    top: feet + "%",
    zIndex: Math.round(feet * 10),
  });
}

function eatAt({ c, r }) {
  const el = cookieEls.get(key(c, r));
  if (!el) return;
  el.remove();
  cookieEls.delete(key(c, r));
  player.eating = EAT_TIME;
  if (cookieEls.size === 0) levelComplete();
}

function levelComplete() {
  player.dancing = DANCE_TIME;
  player.target = null;
  player.dir = player.want = null;
  document.getElementById("toast").classList.add("show");
}

function update(dt) {
  const p = player;
  p.animTime += dt;

  if (p.dancing > 0) {
    p.dancing -= dt;
    setFrame("dance", Math.floor(p.animTime * 4) % 2);
    if (p.dancing <= 0) {
      document.getElementById("toast").classList.remove("show");
      startLevel(level + 1);
    }
    return;
  }
  if (p.eating > 0) {
    p.eating -= dt;
    setFrame("eat", Math.min(2, Math.floor((1 - p.eating / EAT_TIME) * 3)));
    return;
  }

  // Reversing mid-step – instant, like Pac-Man
  if (p.target && p.want && p.dir && p.want.dx === -p.dir.dx && p.want.dy === -p.dir.dy) {
    [p.cell, p.target] = [p.target, p.cell];
    p.t = 1 - p.t;
    p.dir = p.want;
  }

  // At the center of a cell – choose where to go next
  if (!p.target) {
    if (p.want && canMove(p.cell, p.want)) p.dir = p.want;
    else if (!p.want || (p.dir && !canMove(p.cell, p.dir))) p.dir = null;   // no key held – stop
    if (p.dir) {
      p.target = { c: p.cell.c + p.dir.dx, r: p.cell.r + p.dir.dy };
      p.t = 0;
    }
  }

  if (p.target) {
    p.facing = p.dir.row;
    p.t += dt * PLAYER_SPEED * difficulty(level).speed;
    if (p.t >= 1) {
      p.cell = p.target;
      p.target = null;
      p.t = 0;
      // Passing through an exit: leave on one side, enter from the other
      if (p.cell.c < 0)     { p.cell = { c: COLS, r: p.cell.r };  p.target = { c: COLS - 1, r: p.cell.r }; }
      else if (p.cell.c >= COLS) { p.cell = { c: -1, r: p.cell.r }; p.target = { c: 0, r: p.cell.r }; }
      else eatAt(p.cell);
    }
    setFrame(p.facing, Math.floor(p.animTime * 10) % 6);
  } else {
    setFrame(p.facing, 0);   // standing still
  }
  drawPlayer();
}

/* ============================================================
   The nerd: wanders the office with a "?" above his head.
   When he bumps into the player he points at him and the "?"
   turns into "!" – from then on it stays "!"
   (next step: he walks off to tell the manager).
   ============================================================ */
const NERD_SPEED = 2.2;       // cells per second (at level 1)
const POINT_TIME = 1.2;       // how long he points when he catches the player
const CATCH_DIST = 0.8;       // how close (in cells) counts as bumping into the player
const NERD_ANIM = { south: 0, north: 1, east: 2, west: 3, point: 4 };

const nerd = {
  el: null, bubble: null,
  cell: null, target: null, t: 0, dir: null,
  facing: "south", pointing: 0, alerted: false, animTime: 0,
};

function nerdFrame(anim, frame) {
  nerd.el.style.backgroundPosition = `${frame * 20}% ${NERD_ANIM[anim] * 20}%`;
}

// Current position in cells (including the in-between progress)
const posOf = o => o.target
  ? { c: o.cell.c + (o.target.c - o.cell.c) * o.t, r: o.cell.r + (o.target.r - o.cell.r) * o.t }
  : { c: o.cell.c, r: o.cell.r };

// The nerd stays inside the room (no exits) and prefers to keep walking straight
function nerdChooseDir() {
  const all = Object.values(DIRS).filter(d => {
    const nc = nerd.cell.c + d.dx;
    return nc >= 0 && nc < COLS && canMove(nerd.cell, d);
  });
  const forward = all.filter(d => nerd.dir && d === nerd.dir);
  const noBack = all.filter(d => !nerd.dir || !(d.dx === -nerd.dir.dx && d.dy === -nerd.dir.dy));
  if (forward.length && Math.random() < 0.7) return forward[0];
  const pool = noBack.length ? noBack : all;
  return pool[rand(0, pool.length - 1)] || null;
}

function drawNerd() {
  const { c, r } = posOf(nerd);
  const feet = Y(r + 0.5) + CH * 0.32;
  Object.assign(nerd.el.style, {
    left: X(c + 0.5) + "%", top: feet + "%", zIndex: Math.round(feet * 10),
  });
}

function updateNerd(dt) {
  const n = nerd;
  n.animTime += dt;

  // Bumped into the player?
  if (!n.alerted) {
    const a = posOf(n), b = posOf(player);
    if (Math.hypot(a.c - b.c, a.r - b.r) < CATCH_DIST) {
      n.alerted = true;
      n.pointing = POINT_TIME;
      n.bubble.textContent = "!";
      n.bubble.classList.add("alert");
    }
  }

  if (n.pointing > 0) {
    n.pointing -= dt;
    nerdFrame("point", Math.min(2, Math.floor((1 - n.pointing / POINT_TIME) * 5)));
    return;
  }

  if (!n.target) {
    n.dir = nerdChooseDir();
    if (n.dir) { n.target = { c: n.cell.c + n.dir.dx, r: n.cell.r + n.dir.dy }; n.t = 0; }
  }
  if (n.target) {
    n.facing = n.dir.row;
    n.t += dt * NERD_SPEED * difficulty(level).speed;
    if (n.t >= 1) { n.cell = n.target; n.target = null; n.t = 0; }
    nerdFrame(n.facing, Math.floor(n.animTime * 8) % 6);
  }
  drawNerd();
}

function spawnNerd() {
  nerd.el = document.createElement("div");
  nerd.el.className = "nerd";
  nerd.bubble = document.createElement("div");
  nerd.bubble.className = "bubble";
  nerd.bubble.textContent = "?";
  nerd.el.appendChild(nerd.bubble);
  document.getElementById("objects").appendChild(nerd.el);
  // Starts in the top half of the room, far from the player
  Object.assign(nerd, {
    cell: { c: rand(0, COLS - 1), r: rand(0, 2) }, target: null, t: 0, dir: null,
    facing: "south", pointing: 0, alerted: false,
  });
  nerdFrame("south", 0);
  drawNerd();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (board) {
    update(dt);
    if (player.dancing <= 0) updateNerd(dt);
  }
  requestAnimationFrame(loop);
}

/* ---------- Controls: arrows / WASD ---------- */
const KEYS = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right",
  W: "up", S: "down", A: "left", D: "right",
};
// The character moves only while a key is held. On release it stops at the nearest cell
const held = [];   // keys currently held, most recent last
document.addEventListener("keydown", e => {
  const d = KEYS[e.key];
  if (!d) return;
  e.preventDefault();
  if (!held.includes(d)) held.push(d);
  if (player.dancing <= 0) player.want = DIRS[d];
});
document.addEventListener("keyup", e => {
  const d = KEYS[e.key];
  if (!d) return;
  held.splice(held.indexOf(d), 1);
  player.want = held.length ? DIRS[held[held.length - 1]] : null;
});
window.addEventListener("blur", () => { held.length = 0; player.want = null; });

/* ---------- Touch controls: hold a finger and drag in a direction, release to stop ---------- */
let touchStart = null;
const officeEl = document.querySelector(".office");
officeEl.addEventListener("touchstart", e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
officeEl.addEventListener("touchmove", e => {
  if (!touchStart || player.dancing > 0) return;
  const dx = e.touches[0].clientX - touchStart.x;
  const dy = e.touches[0].clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  player.want = DIRS[Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up")];
}, { passive: true });
officeEl.addEventListener("touchend", () => { touchStart = null; player.want = null; });

/* ============================================================
   Level management
   ============================================================ */
const levelLabel = document.getElementById("levelLabel");

function startLevel(n) {
  level = n;
  board = generateBoard(level);
  renderBoard(board);

  // The character starts on the starting cell, with no cookie under it
  const startEl = cookieEls.get(key(START.c, START.r));
  if (startEl) { startEl.remove(); cookieEls.delete(key(START.c, START.r)); }

  player.el = document.createElement("div");
  player.el.className = "player";
  document.getElementById("objects").appendChild(player.el);
  Object.assign(player, {
    cell: { ...START }, target: null, t: 0, dir: null, want: null,
    facing: "south", eating: 0, dancing: 0,
  });
  setFrame("south", 0);
  drawPlayer();
  spawnNerd();

  levelLabel.textContent = `שלב ${level}`;
}

startLevel(1);
requestAnimationFrame(loop);
</script>

</body>
